[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "edifactlib"
version = "0.6.0"
description = "A Python library and CLI tool for parsing, validating, and displaying UN/EDIFACT interchanges."
license = "AGPL-3.0-only"
readme = "README.md"
dependencies = [
  "pydantic",
  "typer",
  "rich"
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "isort"
]
docs = [
  "sphinx",
  "sphinx-rtd-theme"
]

[project.urls]
source = "https://github.com/treffinger/edifactlib"
documentation = "https://edifactlib.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/edifactlib"]

[project.scripts]
edifact = "edifactlib.cli.main:app"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
